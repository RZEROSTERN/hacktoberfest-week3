[project]
name = "scopewise-spike"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "av<17",
    "cmake>=4.4.4",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "psutil>=7.2.2",
    "pydantic>=2.14.1",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
