[project]
name = "postcall-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "reportlab>=5.0.1",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pyinstaller>=6.22.3",
    "pypdf>=6.20.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: runs the real engines (afconvert, whisper.cpp) and needs a small Whisper model"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["reportlab.*"]
ignore_missing_imports = true  # reportlab ships no type hints
